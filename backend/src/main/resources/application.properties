spring.application.name=taskboard

# 自分のパソコンからの接続だけを受け付ける（NFR-21）
server.address=127.0.0.1
server.port=8080

# データベース（Docker の PostgreSQL。compose.yaml）
# パスワードは環境変数 TASKBOARD_DB_PASSWORD から読む（ここには書かない。NFR-26）
spring.datasource.url=jdbc:postgresql://localhost:5432/taskboard
spring.datasource.username=taskboard
spring.datasource.password=${TASKBOARD_DB_PASSWORD}

# テーブルは Flyway（db/migration の SQL）だけが作る。JPA には形の確認だけをさせる
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
